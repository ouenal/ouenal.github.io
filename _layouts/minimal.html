<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% unless page.home %}{{ page.title | escape }} · {% endunless %}Ozan Ünal</title>
  <meta name="description" content="{{ page.description | default: 'Ozan Ünal — machine learning, computer vision, and image restoration.' | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/minimal.css' | relative_url }}">
  <script src="{{ '/assets/js/minimal.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</head>
<body class="{% if page.home %}home{% else %}inner-page{% endif %}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% unless page.home %}
  <header class="site-header">
    <a class="site-name" href="{{ '/' | relative_url }}">Ozan Ünal</a>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}#papers">Papers</a>
      <a href="{{ '/' | relative_url }}#patents">Patents</a>
      <a href="{{ '/' | relative_url }}#cv">CV</a>
    </nav>
  </header>
  {% endunless %}
  <main id="main" class="{% if page.home %}home-main{% else %}content-main{% endif %}">
    {{ content }}
  </main>
  <footer class="site-footer">© {{ site.time | date: '%Y' }} Ozan Ünal <span aria-hidden="true">·</span> Zurich, Switzerland</footer>
</body>
</html>
